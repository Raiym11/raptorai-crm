<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>RaptorAI — Администрирование</title>
<link rel="icon" type="image/png" href="https://www.raptorai.ru/assets/logo.png">
<style>
  :root {
    --bg: #080B0F; --bg2: #0D1117; --bg3: #111820;
    --cyan: #00D4FF; --cyan-dim: #00D4FF18; --cyan-mid: #00D4FF44;
    --white: #F0F4F8; --gray: #8899AA; --border: #1E2A36; --card: #0F1923;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at 10% 0%, #00D4FF0D, transparent 35%), var(--bg);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-name { font-size: 15px; font-weight: 700; }
  .brand-name .accent { color: var(--cyan); }
  .brand-tag { font-size: 11px; color: var(--gray); border-left: 1px solid var(--border); padding-left: 9px; margin-left: 3px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 26px; border-bottom: 1px solid var(--border); }
  .nav-link { font-size: 13px; color: var(--gray); text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; }
  .nav-link:hover { border-color: var(--cyan-mid); color: var(--white); }

  #gate { display: flex; align-items: center; justify-content: center; min-height: 92vh; padding: 20px; }
  .gate-card { background: linear-gradient(180deg, #111C25, var(--card)); border: 1px solid var(--border); border-radius: 16px; padding: 30px; width: 100%; max-width: 360px; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6); text-align: center; }
  .gate-card label { display: block; font-size: 12px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.03em; margin: 18px 0 7px; text-align: left; }
  .gate-card input { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; color: var(--white); font-size: 14px; }
  .gate-card button { width: 100%; margin-top: 20px; background: linear-gradient(135deg, #00D4FF, #00A8CC); color: #05141A; border: none; border-radius: 9px; padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px -8px #00D4FF55; }
  .gate-err { color: #FF6B6B; font-size: 13px; margin-top: 12px; display: none; }

  #panel { display: none; padding: 26px; max-width: 640px; margin: 0 auto; }
  .section-title { font-size: 14px; font-weight: 600; margin: 30px 0 14px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.03em; }
  .section-title:first-child { margin-top: 0; }

  .card { background: linear-gradient(180deg, #111C25, var(--card)); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.03em; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px; color: var(--white); font-size: 14px; }
  button.primary { margin-top: 20px; background: linear-gradient(135deg, #00D4FF, #00A8CC); color: #05141A; border: none; border-radius: 9px; padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .form-msg { font-size: 13px; margin-top: 12px; display: none; }
  .form-msg.error { color: #FF6B6B; }
  .form-msg.success { color: var(--cyan); }

  .emp-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: var(--card); }
  .emp-name { font-size: 14px; font-weight: 500; }
  .emp-position { font-size: 12px; color: var(--cyan); margin: 1px 0; }
  .emp-username { font-size: 12px; color: var(--gray); }
  .emp-status { font-size: 11px; padding: 3px 9px; border-radius: 20px; }
  .emp-status.active { background: #0B2530; color: var(--cyan); }
  .emp-status.inactive { background: #2A1414; color: #FF6B6B; }
  .empty-msg { color: var(--gray); font-size: 13px; padding: 16px; text-align: center; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5,10,14,0.72); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: linear-gradient(180deg, #111C25, var(--card)); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px; width: 100%; max-width: 360px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.7);
    opacity: 0; transform: translateY(10px) scale(0.98); transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .modal-overlay.show .modal-box { opacity: 1; transform: translateY(0) scale(1); }
  .modal-title { font-size: 16px; font-weight: 700; margin: 0 0 10px; }
  .modal-body { font-size: 13px; color: var(--gray); margin: 0 0 16px; line-height: 1.5; }
  .modal-input-wrap input {
    width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 9px;
    padding: 11px 13px; color: var(--white); font-size: 14px; margin-bottom: 4px; font-family: inherit;
  }
  .modal-input-wrap input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px #00D4FF22; }
  .modal-input-wrap { margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  .modal-btn {
    border-radius: 8px; padding: 10px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--white); font-family: inherit;
  }
  .modal-btn.cancel:hover { border-color: #3A4E5F; }
  .modal-btn.confirm { background: linear-gradient(135deg, #00D4FF, #00A8CC); color: #05141A; border: none; }
  .modal-btn.confirm.danger { background: linear-gradient(135deg, #FF6B6B, #CC4444); color: #fff; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="brand" style="flex-direction:column;margin-bottom:16px">
      <img src="https://www.raptorai.ru/assets/logo.png" alt="RaptorAI" style="display:block;width:100%;height:auto;margin:0 auto">
    </div>
    <div style="font-size:12px;color:var(--gray);margin-bottom:6px">Администрирование</div>
    <label>Код доступа</label>
    <input type="password" id="admin-code" autocomplete="off">
    <button onclick="loadPanel()" style="width:100%;margin-top:20px;background:linear-gradient(135deg,#00D4FF,#00A8CC);color:#05141A;border:none;border-radius:9px;padding:13px;font-size:14px;font-weight:700;cursor:pointer">Войти</button>
    <div class="gate-err" id="gate-err">Неверный код доступа.</div>
  </div>
</div>

<div id="panel">
  <div style="text-align:center;padding:32px 0 20px">
    <img src="https://www.raptorai.ru/assets/logo.png" alt="RaptorAI" style="display:block;width:70%;max-width:420px;height:auto;margin:0 auto">
  </div>
  <div class="topbar" style="padding:0 0 18px;margin-bottom:20px;justify-content:space-between">
    <div class="brand-tag" style="border-left:none;padding-left:0">Администрирование</div>
    <div style="display:flex;align-items:center;gap:10px">
      <a class="nav-link" href="board.html">Доска сделок →</a>
      <button onclick="adminLogout()" style="background:none;border:1px solid var(--border);color:var(--gray);border-radius:8px;padding:9px 15px;font-size:13px;cursor:pointer;font-family:inherit">Выйти</button>
    </div>
  </div>

  <div class="section-title">Добавить сотрудника</div>
  <div class="card">
    <form id="create-form">
      <label>Имя сотрудника</label>
      <input type="text" id="c-name" required placeholder="Например: Андрей">
      <label>Должность</label>
      <input type="text" id="c-position" required placeholder="Например: Менеджер по продажам">
      <label>Логин</label>
      <input type="text" id="c-username" required placeholder="andrey" autocomplete="off">
      <label>Пароль</label>
      <input type="text" id="c-password" required placeholder="Придумайте пароль" autocomplete="off">
      <button type="submit" class="primary">Создать сотрудника</button>
      <div class="form-msg" id="create-msg"></div>
    </form>
  </div>

  <div class="section-title">Сотрудники</div>
  <div id="employees-list"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-input-wrap" id="modal-input-wrap" style="display:none">
      <input type="text" id="modal-input" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modal-cancel">Отмена</button>
      <button class="modal-btn confirm" id="modal-confirm">ОК</button>
    </div>
  </div>
</div>

<script>
  const WEBHOOK_SECRET = '52467ae9c9b28bbfee25b687da8442336bd26cbb659e815e';
  const CREATE_URL = 'https://n8n.raptorai.ru/crm-api/crm-create-employee';
  const LIST_URL = 'https://n8n.raptorai.ru/crm-api/crm-employees-list';
  const DELETE_URL = 'https://n8n.raptorai.ru/crm-api/crm-delete-employee';
  const RESET_URL = 'https://n8n.raptorai.ru/crm-api/crm-reset-password';
  let adminCode = '';

  const ADMIN_SESSION_KEY = 'crm_admin_session';
  const ADMIN_SESSION_TTL_MS = 24 * 60 * 60 * 1000; // 24 часа

  function saveAdminSession(code) {
    try {
      localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ code, expires: Date.now() + ADMIN_SESSION_TTL_MS }));
    } catch (e) {}
  }

  function loadAdminSession() {
    try {
      const raw = localStorage.getItem(ADMIN_SESSION_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !s.expires || Date.now() > s.expires) {
        localStorage.removeItem(ADMIN_SESSION_KEY);
        return null;
      }
      return s;
    } catch (e) { return null; }
  }

  function clearAdminSession() {
    try { localStorage.removeItem(ADMIN_SESSION_KEY); } catch (e) {}
  }

  function adminLogout() {
    clearAdminSession();
    adminCode = '';
    document.getElementById('admin-code').value = '';
    document.getElementById('panel').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
  }

  (async function tryAutoLogin() {
    const session = loadAdminSession();
    if (!session) return;
    adminCode = session.code;
    const ok = await fetchEmployees();
    if (ok) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
    } else {
      clearAdminSession();
      adminCode = '';
    }
  })();

  function showModal(opts) {
    opts = opts || {};
    return new Promise(function(resolve) {
      const overlay = document.getElementById('modal-overlay');
      const inputWrap = document.getElementById('modal-input-wrap');
      const input = document.getElementById('modal-input');
      const cancelBtn = document.getElementById('modal-cancel');
      const confirmBtn = document.getElementById('modal-confirm');

      document.getElementById('modal-title').textContent = opts.title || '';
      document.getElementById('modal-body').textContent = opts.body || '';
      inputWrap.style.display = opts.withInput ? 'block' : 'none';
      input.type = opts.inputType || 'text';
      input.value = opts.inputValue || '';
      input.placeholder = opts.inputPlaceholder || '';
      cancelBtn.style.display = opts.alertOnly ? 'none' : 'inline-block';
      confirmBtn.textContent = opts.confirmText || 'ОК';
      confirmBtn.className = 'modal-btn confirm' + (opts.danger ? ' danger' : '');
      cancelBtn.textContent = opts.cancelText || 'Отмена';

      function cleanup(result) {
        overlay.classList.remove('show');
        confirmBtn.removeEventListener('click', onConfirm);
        cancelBtn.removeEventListener('click', onCancel);
        overlay.removeEventListener('click', onOverlay);
        document.removeEventListener('keydown', onKey);
        resolve(result);
      }
      function onConfirm() { cleanup(opts.withInput ? input.value : true); }
      function onCancel() { cleanup(opts.withInput ? null : false); }
      function onOverlay(e) { if (e.target === overlay && !opts.alertOnly) onCancel(); }
      function onKey(e) {
        if (e.key === 'Enter') { e.preventDefault(); onConfirm(); }
        else if (e.key === 'Escape' && !opts.alertOnly) { onCancel(); }
      }

      confirmBtn.addEventListener('click', onConfirm);
      cancelBtn.addEventListener('click', onCancel);
      overlay.addEventListener('click', onOverlay);
      document.addEventListener('keydown', onKey);
      overlay.classList.add('show');
      if (opts.withInput) setTimeout(function() { input.focus(); }, 60);
    });
  }

  async function loadPanel() {
    adminCode = document.getElementById('admin-code').value.trim();
    document.getElementById('gate-err').style.display = 'none';
    const ok = await fetchEmployees();
    if (ok) {
      saveAdminSession(adminCode);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
    } else {
      document.getElementById('gate-err').style.display = 'block';
    }
  }

  async function fetchEmployees() {
    try {
      const res = await fetch(LIST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': WEBHOOK_SECRET },
        body: JSON.stringify({ adminCode: adminCode })
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) return false;
      renderEmployees(data.employees || []);
      return true;
    } catch (e) { return false; }
  }

  function renderEmployees(employees) {
    const el = document.getElementById('employees-list');
    if (employees.length === 0) {
      el.innerHTML = '<div class="empty-msg">Пока нет ни одного сотрудника.</div>';
      return;
    }
    el.innerHTML = employees.map(function(e) {
      const isActive = String(e.active).toUpperCase() === 'TRUE';
      const positionHtml = e.position ? '<div class="emp-position">' + e.position + '</div>' : '';
      return '<div class="emp-row"><div><div class="emp-name">' + e.name + '</div>' + positionHtml + '<div class="emp-username">@' + e.username + '</div></div>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
        '<span class="emp-status ' + (isActive ? 'active' : 'inactive') + '">' + (isActive ? 'Активен' : 'Отключён') + '</span>' +
        '<button onclick="resetPassword(' + e.id + ', \'' + e.name.replace(/'/g, "\\'") + '\')" style="background:none;border:1px solid var(--border);color:var(--gray);border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer">Сбросить пароль</button>' +
        '<button onclick="deleteEmployee(' + e.id + ', \'' + e.name.replace(/'/g, "\\'") + '\')" style="background:none;border:1px solid #FF6B6B44;color:#FF6B6B;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer">Удалить</button>' +
        '</div></div>';
    }).join('');
  }

  async function deleteEmployee(id, name) {
    const ok = await showModal({
      title: 'Удалить сотрудника?',
      body: 'Сотрудник «' + name + '» будет удалён без возможности восстановления.',
      confirmText: 'Удалить', cancelText: 'Отмена', danger: true
    });
    if (!ok) return;
    try {
      await fetch(DELETE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': WEBHOOK_SECRET },
        body: JSON.stringify({ adminCode: adminCode, id: id })
      });
      fetchEmployees();
    } catch (e) {
      await showModal({ title: 'Ошибка', body: 'Не удалось удалить сотрудника.', alertOnly: true, confirmText: 'ОК' });
    }
  }

  async function resetPassword(id, name) {
    const newPassword = await showModal({
      title: 'Сброс пароля',
      body: 'Новый пароль для «' + name + '»:',
      withInput: true, inputPlaceholder: 'Введите новый пароль',
      confirmText: 'Сохранить', cancelText: 'Отмена'
    });
    if (!newPassword) return;
    try {
      const res = await fetch(RESET_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': WEBHOOK_SECRET },
        body: JSON.stringify({ adminCode: adminCode, id: id, newPassword: newPassword })
      });
      const data = await res.json().catch(function() { return {}; });
      if (data.ok) {
        await showModal({
          title: 'Пароль обновлён',
          body: 'Сообщите сотруднику новый пароль лично: ' + newPassword,
          alertOnly: true, confirmText: 'Готово'
        });
      } else {
        await showModal({ title: 'Ошибка', body: 'Не удалось сбросить пароль.', alertOnly: true, confirmText: 'ОК' });
      }
    } catch (e) {
      await showModal({ title: 'Ошибка', body: 'Не удалось сбросить пароль.', alertOnly: true, confirmText: 'ОК' });
    }
  }

  document.getElementById('create-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg = document.getElementById('create-msg');
    msg.style.display = 'none';

    const name = document.getElementById('c-name').value.trim();
    const position = document.getElementById('c-position').value.trim();
    const username = document.getElementById('c-username').value.trim();
    const password = document.getElementById('c-password').value;

    try {
      const res = await fetch(CREATE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': WEBHOOK_SECRET },
        body: JSON.stringify({ adminCode: adminCode, name, position, username, password })
      });
      const data = await res.json().catch(function() { return {}; });
      if (!res.ok || data.ok === false) {
        msg.textContent = data.error || 'Не удалось создать сотрудника.';
        msg.className = 'form-msg error'; msg.style.display = 'block';
        return;
      }
      msg.textContent = 'Сотрудник создан. Логин: ' + username + ', пароль: ' + password + ' — сообщите их сотруднику лично.';
      msg.className = 'form-msg success'; msg.style.display = 'block';
      document.getElementById('create-form').reset();
      fetchEmployees();
    } catch (err) {
      msg.textContent = 'Ошибка соединения.';
      msg.className = 'form-msg error'; msg.style.display = 'block';
    }
  });
</script>
</body>
</html>
