<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>RaptorAI — CRM</title>
<link rel="icon" type="image/x-icon" href="https://www.raptorai.ru/favicon.ico?v=2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #080B0F; --bg2: #0D1117; --bg3: #111820;
    --cyan: #00D4FF; --cyan-dim: #00D4FF18; --cyan-mid: #00D4FF44;
    --white: #F0F4F8; --gray: #8899AA; --border: #1E2A36; --card: #0F1923;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 10% 0%, #00D4FF0D, transparent 35%),
      var(--bg);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    animation: pageFadeIn 0.4s ease both;
  }
  @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .pop-in { animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .tab-panel { animation: fadeIn 0.3s ease both; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-name { font-size: 15px; font-weight: 700; }
  .brand-name .accent { color: var(--cyan); }
  .brand-tag { font-size: 11px; color: var(--gray); border-left: 1px solid var(--border); padding-left: 9px; margin-left: 3px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 26px; border-bottom: 1px solid var(--border); }
  .topbar-actions { display: flex; align-items: center; gap: 14px; }
  .refresh-btn {
    display: flex; align-items: center; gap: 7px; background: var(--card); border: 1px solid var(--border);
    color: var(--white); border-radius: 8px; padding: 9px 15px; font-size: 13px; cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
  }
  .refresh-btn:hover { border-color: var(--cyan-mid); }
  .refresh-btn:active { transform: scale(0.96); }
  .refresh-btn svg { transition: transform 0.4s ease; }
  .refresh-btn.spinning { border-color: var(--cyan-mid); background: var(--cyan-dim); }
  .refresh-btn.spinning svg { animation: spinIcon 0.7s linear infinite; }
  @keyframes spinIcon { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .nav-link { font-size: 13px; color: var(--gray); text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 9px 15px; transition: border-color 0.2s ease, color 0.2s ease; }
  .nav-link:hover { border-color: var(--cyan-mid); color: var(--white); }
  .columns { transition: opacity 0.25s ease; }
  .columns.fading { opacity: 0.35; }

  #gate { display: flex; align-items: center; justify-content: center; min-height: 92vh; padding: 20px; }
  .gate-card { background: linear-gradient(180deg, #111C25, var(--card)); border: 1px solid var(--border); border-radius: 16px; padding: 30px; width: 100%; max-width: 360px; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6); text-align: center; animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .gate-card button { transition: transform 0.15s ease, box-shadow 0.2s ease; }
  .gate-card button:active { transform: scale(0.97); }
  .gate-card label { display: block; font-size: 12px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.03em; margin: 18px 0 7px; text-align: left; }
  .gate-card input { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; color: var(--white); font-size: 14px; }
  .gate-card button { width: 100%; margin-top: 20px; background: linear-gradient(135deg, #00D4FF, #00A8CC); color: #05141A; border: none; border-radius: 9px; padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px -8px #00D4FF55; }
  .gate-err { color: #FF6B6B; font-size: 13px; margin-top: 12px; display: none; }

  #board { display: none; padding: 22px 26px; overflow-x: auto; }
  .columns { display: flex; gap: 16px; min-width: max-content; align-items: flex-start; }
  .column { width: 268px; flex-shrink: 0; }
  .col-header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px; }
  .col-header .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); display: inline-block; margin-right: 7px; }
  .col-title { font-size: 12.5px; font-weight: 600; color: var(--white); }
  .col-count { font-size: 11px; color: var(--gray); background: var(--bg3); border-radius: 20px; padding: 2px 8px; }
  .col-body { display: flex; flex-direction: column; gap: 10px; min-height: 40px; }
  .deal-card { background: linear-gradient(180deg, #111C25, var(--card)); border: 1px solid var(--border); border-radius: 12px; padding: 15px; transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; }
  .deal-card:hover { border-color: var(--cyan-mid); transform: translateY(-3px); box-shadow: 0 10px 24px -12px rgba(0,0,0,0.6); }
  .deal-top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
  .deal-client { font-size: 14px; font-weight: 600; }
  .deal-amount { font-size: 13px; color: var(--cyan); font-weight: 600; margin-bottom: 8px; }
  .deal-meta { font-size: 11px; color: var(--gray); margin-bottom: 12px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .deal-reason { font-size: 11px; color: #FF6B6B; background: #2A141433; border: 1px solid #FF6B6B33; border-radius: 7px; padding: 6px 8px; margin-bottom: 10px; }
  .deal-card select { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 7px; color: var(--white); font-size: 12px; padding: 7px 8px; }
  .empty-msg { color: var(--gray); font-size: 12px; padding: 20px 4px; text-align: center; border: 1px dashed var(--border); border-radius: 10px; }

  .deal-delete-btn {
    background: none; border: 1px solid var(--border); color: var(--gray); border-radius: 6px;
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: border-color 0.2s ease, color 0.2s ease;
  }
  .deal-delete-btn:hover { border-color: #FF6B6B88; color: #FF6B6B; }

  .tabs-bar { display: flex; gap: 12px; padding: 18px 26px 0; }
  .tab-btn { background: none; border: 1px solid var(--border); color: var(--gray); border-radius: 8px; padding: 9px 18px; font-size: 13px; cursor: pointer; font-family: inherit; transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease, transform 0.15s ease; }
  .tab-btn:hover { border-color: var(--cyan-mid); color: var(--white); }
  .tab-btn:active { transform: scale(0.96); }
  .tab-btn.active { background: var(--cyan-dim); border-color: var(--cyan-mid); color: var(--cyan); font-weight: 600; }

  #analytics-panel { --gap: 24px; }

  .stats-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: var(--gap); }
  .stat-card { background: linear-gradient(180deg, #111C25, var(--card)); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; min-width: 160px; flex: 1; transition: border-color 0.2s ease, transform 0.2s ease; }
  .stat-card:hover { border-color: var(--cyan-mid); transform: translateY(-2px); }
  .stat-value { font-size: 24px; font-weight: 700; color: var(--white); }
  .stat-value.cyan { color: var(--cyan); }
  .stat-value.green { color: #4ADE80; }
  .stat-value.red { color: #FF6B6B; }
  .stat-label { font-size: 11px; color: var(--gray); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.03em; }

  .period-toggle { display: flex; gap: 10px; margin-bottom: var(--gap); }
  .period-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--gray); border-radius: 8px; padding: 8px 18px; font-size: 12.5px; cursor: pointer; font-family: inherit; transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease, transform 0.15s ease; }
  .period-btn:hover { color: var(--white); }
  .period-btn:active { transform: scale(0.95); }
  .period-btn.active { background: var(--cyan-dim); border-color: var(--cyan-mid); color: var(--cyan); font-weight: 600; }

  .chart-card { background: linear-gradient(180deg, #111C25, var(--card)); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; margin-bottom: var(--gap); transition: border-color 0.2s ease; }
  .chart-card:hover { border-color: var(--cyan-mid); }
  .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 18px; color: var(--white); }
  .chart-canvas-wrap { position: relative; height: 260px; }
  .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--gap); align-items: start; }

  .emp-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .emp-table th { text-align: left; color: var(--gray); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.02em; }
  .emp-table td { padding: 11px 10px; border-bottom: 1px solid var(--border); }
  .emp-table tr:last-child td { border-bottom: none; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5,10,14,0.72); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: linear-gradient(180deg, #111C25, var(--card)); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px; width: 100%; max-width: 340px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.7);
    opacity: 0; transform: translateY(10px) scale(0.98); transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .modal-overlay.show .modal-box { opacity: 1; transform: translateY(0) scale(1); }
  .modal-title { font-size: 16px; font-weight: 700; margin: 0 0 10px; }
  .modal-body { font-size: 13px; color: var(--gray); margin: 0 0 16px; line-height: 1.5; }
  .modal-input-wrap input {
    width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 9px;
    padding: 11px 13px; color: var(--white); font-size: 14px; margin-bottom: 4px; font-family: inherit;
  }
  .modal-input-wrap input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px #00D4FF22; }
  .modal-input-wrap { margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-btn {
    border-radius: 8px; padding: 10px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--white); font-family: inherit;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .modal-btn:active { transform: scale(0.96); }
  .modal-btn.cancel:hover { border-color: #3A4E5F; }
  .modal-btn.confirm { background: linear-gradient(135deg, #00D4FF, #00A8CC); color: #05141A; border: none; }
  .modal-btn.confirm.danger { background: linear-gradient(135deg, #FF6B6B, #CC4444); color: #fff; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="brand" style="justify-content:center;margin-bottom:6px">
      <img src="https://www.raptorai.ru/assets/logo.png" alt="RaptorAI" style="display:block;height:64px;width:auto;max-width:100%;object-fit:contain">
    </div>
    <div style="font-size:12px;color:var(--gray);margin-bottom:6px">CRM</div>
    <label>Код доступа</label>
    <input type="password" id="admin-code" autocomplete="off">
    <button onclick="loadBoard()">Войти</button>
    <div class="gate-err" id="gate-err">Неверный код доступа.</div>
  </div>
</div>

<div id="board">
  <div class="topbar">
    <div class="brand">
      <img src="https://www.raptorai.ru/assets/logo.png" alt="RaptorAI" style="display:block;height:40px;width:auto;object-fit:contain">
      <div class="brand-tag">CRM · Сделки</div>
    </div>
    <div class="topbar-actions">
      <a class="nav-link" href="admin.html">Администрирование</a>
      <button class="refresh-btn" id="refresh-btn" onclick="handleRefreshClick()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6M4 10a8 8 0 0114-5M20 14a8 8 0 01-14 5" stroke="#F0F4F8" stroke-width="2" stroke-linecap="round"/></svg>
        Обновить
      </button>
      <button class="nav-link" onclick="boardLogout()" style="cursor:pointer;font-family:inherit;background:none">Выйти</button>
    </div>
  </div>
  <div class="tabs-bar">
    <button class="tab-btn active" id="tab-board" onclick="showTab('board')">Доска</button>
    <button class="tab-btn" id="tab-analytics" onclick="showTab('analytics')">Аналитика</button>
  </div>
  <div class="columns" id="columns"></div>
  <div id="analytics-panel" style="display:none">
    <div class="stats-row" id="stats-row"></div>
    <div class="period-toggle" id="period-toggle">
      <button class="period-btn" data-period="day" onclick="setPeriod('day')">День</button>
      <button class="period-btn active" data-period="week" onclick="setPeriod('week')">Неделя</button>
      <button class="period-btn" data-period="month" onclick="setPeriod('month')">Месяц</button>
    </div>
    <div class="chart-card">
      <div class="chart-title">Лиды по периодам</div>
      <div class="chart-canvas-wrap"><canvas id="chart-timeseries"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Выручка по периодам</div>
      <div class="chart-canvas-wrap"><canvas id="chart-revenue"></canvas></div>
    </div>
    <div class="analytics-grid">
      <div class="chart-card">
        <div class="chart-title">По сотрудникам</div>
        <div id="employee-table"></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">По каналам</div>
        <div id="channel-table"></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Распределение по статусам</div>
        <div class="chart-canvas-wrap"><canvas id="chart-status"></canvas></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-input-wrap" id="modal-input-wrap" style="display:none">
      <input type="password" id="modal-input" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modal-cancel">Отмена</button>
      <button class="modal-btn confirm" id="modal-confirm">ОК</button>
    </div>
  </div>
</div>

<script>
  const LIST_URL = 'https://n8n.raptorai.ru/crm-api/crm-list';
  const UPDATE_URL = 'https://n8n.raptorai.ru/crm-api/crm-update-stage';
  const DELETE_DEAL_URL = 'https://n8n.raptorai.ru/crm-api/crm-delete-deal';
  const WEBHOOK_SECRET = '52467ae9c9b28bbfee25b687da8442336bd26cbb659e815e';
  const STAGES = ['Новый лид', 'Записался на консультацию', 'В разработке', 'Сдан и закрыт', 'Отказ'];

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const datePart = String(dateStr).split('T')[0];
    const parts = datePart.split('-');
    if (parts.length !== 3) return datePart;
    return parts[2] + '.' + parts[1] + '.' + parts[0];
  }
  let adminCode = '';
  let allDeals = [];
  let currentPeriod = 'week';
  let timeseriesChart = null;
  let statusChart = null;
  let revenueChart = null;

  function formatMoney(n) {
    n = Math.round(Number(n) || 0);
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  const BOARD_SESSION_KEY = 'crm_board_session';
  const BOARD_SESSION_TTL_MS = 24 * 60 * 60 * 1000; // 24 часа

  function saveBoardSession(code) {
    try {
      localStorage.setItem(BOARD_SESSION_KEY, JSON.stringify({ code, expires: Date.now() + BOARD_SESSION_TTL_MS }));
    } catch (e) {}
  }

  function loadBoardSession() {
    try {
      const raw = localStorage.getItem(BOARD_SESSION_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !s.expires || Date.now() > s.expires) {
        localStorage.removeItem(BOARD_SESSION_KEY);
        return null;
      }
      return s;
    } catch (e) { return null; }
  }

  function clearBoardSession() {
    try { localStorage.removeItem(BOARD_SESSION_KEY); } catch (e) {}
  }

  function boardLogout() {
    clearBoardSession();
    adminCode = '';
    document.getElementById('admin-code').value = '';
    document.getElementById('board').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
  }

  (async function tryBoardAutoLogin() {
    const session = loadBoardSession();
    if (!session) return;
    adminCode = session.code;
    const ok = await fetchDeals();
    if (ok) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('board').style.display = 'block';
    } else {
      clearBoardSession();
      adminCode = '';
    }
  })();

  async function loadBoard() {
    adminCode = document.getElementById('admin-code').value.trim();
    document.getElementById('gate-err').style.display = 'none';
    const ok = await fetchDeals();
    if (ok) {
      saveBoardSession(adminCode);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('board').style.display = 'block';
    } else {
      document.getElementById('gate-err').style.display = 'block';
    }
  }

  async function handleRefreshClick() {
    const btn = document.getElementById('refresh-btn');
    const columnsEl = document.getElementById('columns');
    btn.classList.add('spinning');
    btn.disabled = true;
    columnsEl.classList.add('fading');
    const started = Date.now();
    await fetchDeals();
    const elapsed = Date.now() - started;
    const minSpin = 500; // чтобы анимация всегда была плавно заметна
    setTimeout(function() {
      btn.classList.remove('spinning');
      btn.disabled = false;
      columnsEl.classList.remove('fading');
    }, Math.max(0, minSpin - elapsed));
  }

  async function fetchDeals() {
    try {
      const res = await fetch(LIST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': WEBHOOK_SECRET },
        body: JSON.stringify({ accessCode: adminCode })
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) return false;
      allDeals = data.deals || [];
      renderBoard(allDeals);
      if (document.getElementById('analytics-panel').style.display === 'block') renderAnalytics();
      return true;
    } catch (e) {
      return false;
    }
  }

  function playEntrance(el) {
    if (!el) return;
    el.classList.remove('tab-panel');
    void el.offsetWidth;
    el.classList.add('tab-panel');
  }

  function showTab(tab) {
    document.getElementById('tab-board').classList.toggle('active', tab === 'board');
    document.getElementById('tab-analytics').classList.toggle('active', tab === 'analytics');
    const columnsEl = document.getElementById('columns');
    const analyticsEl = document.getElementById('analytics-panel');
    columnsEl.style.display = tab === 'board' ? 'flex' : 'none';
    analyticsEl.style.display = tab === 'analytics' ? 'block' : 'none';
    if (tab === 'analytics') {
      renderAnalytics();
      playEntrance(analyticsEl);
    } else {
      playEntrance(columnsEl);
    }
  }

  function setPeriod(period) {
    currentPeriod = period;
    document.querySelectorAll('.period-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.period === period);
    });
    renderTimeseries(allDeals, currentPeriod);
    renderRevenueChart(allDeals, currentPeriod);
  }

  function statCard(value, label, colorClass, i) {
    return '<div class="stat-card fade-in-up" style="animation-delay:' + (i * 50) + 'ms">' +
      '<div class="stat-value ' + (colorClass || '') + '">' + value + '</div><div class="stat-label">' + label + '</div></div>';
  }

  function renderStats(deals) {
    const total = deals.length;
    const success = deals.filter(function(d) { return d.status === 'Сдан и закрыт'; }).length;
    const reject = deals.filter(function(d) { return d.status === 'Отказ'; }).length;
    const conv = total ? Math.round(success / total * 100) : 0;
    const revenue = deals.reduce(function(sum, d) { return sum + (d.status === 'Сдан и закрыт' ? (d.commission || 0) : 0); }, 0);
    document.getElementById('stats-row').innerHTML =
      statCard(total, 'Всего лидов', '', 0) +
      statCard(success, 'Успешно закрыто', 'green', 1) +
      statCard(reject, 'Отказы', 'red', 2) +
      statCard(conv + '%', 'Конверсия', 'cyan', 3) +
      statCard(formatMoney(revenue) + ' ₽', 'Комиссия (закрытые)', 'cyan', 4);
  }

  function dateKeyDay(dateStr) { return String(dateStr).split('T')[0]; }

  function dateKeyWeek(dateStr) {
    const p = dateKeyDay(dateStr).split('-').map(Number);
    const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    const dow = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() - dow + 1);
    return d.toISOString().split('T')[0];
  }

  function dateKeyMonth(dateStr) {
    const p = dateKeyDay(dateStr).split('-');
    return p[0] + '-' + p[1];
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function labelForKey(key, period) {
    if (period === 'day') {
      const p = key.split('-');
      return p[2] + '.' + p[1];
    }
    if (period === 'week') {
      const p = key.split('-').map(Number);
      const start = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
      const end = new Date(start);
      end.setUTCDate(start.getUTCDate() + 6);
      const fmt = function(dd) { return pad2(dd.getUTCDate()) + '.' + pad2(dd.getUTCMonth() + 1); };
      return fmt(start) + '–' + fmt(end);
    }
    const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    const p = key.split('-');
    return months[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }

  function computeBuckets(deals, period) {
    const keyFn = period === 'day' ? dateKeyDay : period === 'week' ? dateKeyWeek : dateKeyMonth;
    const limit = period === 'day' ? 14 : period === 'week' ? 10 : 12;
    const buckets = {};
    deals.forEach(function(d) {
      if (!d.date) return;
      const key = keyFn(d.date);
      if (!buckets[key]) buckets[key] = { success: 0, reject: 0, other: 0, revenue: 0 };
      if (d.status === 'Сдан и закрыт') { buckets[key].success++; buckets[key].revenue += (parseFloat(d.amount) || 0); }
      else if (d.status === 'Отказ') buckets[key].reject++;
      else buckets[key].other++;
    });
    const keys = Object.keys(buckets).sort().slice(-limit);
    return keys.map(function(k) {
      return { label: labelForKey(k, period), success: buckets[k].success, reject: buckets[k].reject, other: buckets[k].other, revenue: buckets[k].revenue };
    });
  }

  function chartLibReady(canvas) {
    if (typeof Chart !== 'undefined') return true;
    const wrap = canvas.parentElement;
    wrap.innerHTML = '<div class="empty-msg">Не удалось загрузить библиотеку графиков. Проверьте интернет-соединение или отключите блокировщик рекламы, затем обновите страницу.</div>';
    return false;
  }

  function renderTimeseries(deals, period) {
    const canvas = document.getElementById('chart-timeseries');
    if (!canvas || !chartLibReady(canvas)) return;
    const data = computeBuckets(deals, period);
    if (timeseriesChart) timeseriesChart.destroy();
    timeseriesChart = new Chart(canvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: data.map(function(b) { return b.label; }),
        datasets: [
          { label: 'Успешно', data: data.map(function(b) { return b.success; }), backgroundColor: '#4ADE80' },
          { label: 'Отказ', data: data.map(function(b) { return b.reject; }), backgroundColor: '#FF6B6B' },
          { label: 'В работе', data: data.map(function(b) { return b.other; }), backgroundColor: '#00D4FF66' }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { stacked: true, ticks: { color: '#8899AA' }, grid: { color: '#1E2A36' } },
          y: { stacked: true, beginAtZero: true, ticks: { color: '#8899AA', precision: 0 }, grid: { color: '#1E2A36' } }
        },
        plugins: { legend: { labels: { color: '#F0F4F8' } } }
      }
    });
  }

  function renderRevenueChart(deals, period) {
    const canvas = document.getElementById('chart-revenue');
    if (!canvas || !chartLibReady(canvas)) return;
    const data = computeBuckets(deals, period);
    if (revenueChart) revenueChart.destroy();
    revenueChart = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels: data.map(function(b) { return b.label; }),
        datasets: [{
          label: 'Выручка, ₽',
          data: data.map(function(b) { return b.revenue; }),
          borderColor: '#00D4FF',
          backgroundColor: '#00D4FF22',
          fill: true,
          tension: 0.3,
          pointBackgroundColor: '#00D4FF',
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { ticks: { color: '#8899AA' }, grid: { color: '#1E2A36' } },
          y: { beginAtZero: true, ticks: { color: '#8899AA', callback: function(v) { return formatMoney(v); } }, grid: { color: '#1E2A36' } }
        },
        plugins: {
          legend: { labels: { color: '#F0F4F8' } },
          tooltip: { callbacks: { label: function(ctx) { return 'Выручка: ' + formatMoney(ctx.parsed.y) + ' ₽'; } } }
        }
      }
    });
  }

  function renderChannelTable(deals) {
    const map = {};
    deals.forEach(function(d) {
      const ch = d.channel || 'Не указан';
      if (!map[ch]) map[ch] = { total: 0, success: 0, reject: 0 };
      map[ch].total++;
      if (d.status === 'Сдан и закрыт') map[ch].success++;
      else if (d.status === 'Отказ') map[ch].reject++;
    });
    const rows = Object.keys(map).map(function(ch) {
      const s = map[ch];
      return { name: ch, total: s.total, success: s.success, reject: s.reject, conv: s.total ? Math.round(s.success / s.total * 100) : 0 };
    }).sort(function(a, b) { return b.total - a.total; });

    const el = document.getElementById('channel-table');
    if (rows.length === 0) {
      el.innerHTML = '<div class="empty-msg">Нет данных</div>';
      return;
    }
    let html = '<table class="emp-table"><thead><tr><th>Канал</th><th>Лидов</th><th>Успешно</th><th>Конверсия</th></tr></thead><tbody>';
    rows.forEach(function(r) {
      html += '<tr><td>' + r.name + '</td><td>' + r.total + '</td><td style="color:#4ADE80">' + r.success + '</td><td>' + r.conv + '%</td></tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  function renderStatusChart(deals) {
    const canvas = document.getElementById('chart-status');
    if (!canvas || !chartLibReady(canvas)) return;
    const success = deals.filter(function(d) { return d.status === 'Сдан и закрыт'; }).length;
    const reject = deals.filter(function(d) { return d.status === 'Отказ'; }).length;
    const other = deals.length - success - reject;
    if (statusChart) statusChart.destroy();
    statusChart = new Chart(canvas.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: ['Успешно', 'Отказ', 'В работе'],
        datasets: [{ data: [success, reject, other], backgroundColor: ['#4ADE80', '#FF6B6B', '#00D4FF66'], borderColor: '#0F1923', borderWidth: 2 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#F0F4F8' } } } }
    });
  }

  function renderEmployeeTable(deals) {
    const map = {};
    deals.forEach(function(d) {
      const name = d.employee || 'Без сотрудника';
      if (!map[name]) map[name] = { total: 0, success: 0, reject: 0, revenue: 0 };
      map[name].total++;
      if (d.status === 'Сдан и закрыт') { map[name].success++; map[name].revenue += (d.commission || 0); }
      else if (d.status === 'Отказ') map[name].reject++;
    });
    const rows = Object.keys(map).map(function(name) {
      const s = map[name];
      return { name: name, total: s.total, success: s.success, reject: s.reject, revenue: s.revenue, conv: s.total ? Math.round(s.success / s.total * 100) : 0 };
    }).sort(function(a, b) { return b.total - a.total; });

    const el = document.getElementById('employee-table');
    if (rows.length === 0) {
      el.innerHTML = '<div class="empty-msg">Нет данных</div>';
      return;
    }
    let html = '<table class="emp-table"><thead><tr><th>Сотрудник</th><th>Всего</th><th>Успешно</th><th>Отказ</th><th>Конверсия</th><th>Комиссия</th></tr></thead><tbody>';
    rows.forEach(function(r) {
      html += '<tr><td>' + r.name + '</td><td>' + r.total + '</td><td style="color:#4ADE80">' + r.success + '</td><td style="color:#FF6B6B">' + r.reject + '</td><td>' + r.conv + '%</td><td>' + formatMoney(r.revenue) + ' ₽</td></tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  function renderAnalytics() {
    renderStats(allDeals);
    renderTimeseries(allDeals, currentPeriod);
    renderRevenueChart(allDeals, currentPeriod);
    renderStatusChart(allDeals);
    renderEmployeeTable(allDeals);
    renderChannelTable(allDeals);
  }

  function renderBoard(deals) {
    const columnsEl = document.getElementById('columns');
    columnsEl.innerHTML = '';
    STAGES.forEach(function(stage, stageIdx) {
      const col = document.createElement('div');
      col.className = 'column fade-in-up';
      col.style.animationDelay = (stageIdx * 60) + 'ms';
      const stageDeals = deals.filter(function(d) { return d.status === stage; });
      col.innerHTML = '<div class="col-header"><span class="col-title"><span class="dot"></span>' + stage + '</span><span class="col-count">' + stageDeals.length + '</span></div><div class="col-body"></div>';
      columnsEl.appendChild(col);
      const body = col.querySelector('.col-body');
      if (stageDeals.length === 0) {
        body.innerHTML = '<div class="empty-msg">Пусто</div>';
      }
      stageDeals.forEach(function(d, i) {
        const card = document.createElement('div');
        card.className = 'deal-card fade-in-up';
        card.style.animationDelay = (i * 45) + 'ms';
        const select = STAGES.map(function(s) {
          return '<option value="' + s + '"' + (s === d.status ? ' selected' : '') + '>' + s + '</option>';
        }).join('');
        const reasonHtml = (d.status === 'Отказ' && d.reason) ? '<div class="deal-reason">Причина: ' + d.reason + '</div>' : '';
        card.innerHTML =
          '<div class="deal-top-row"><div class="deal-client">' + (d.client || '—') + '</div>' +
          '<button class="deal-delete-btn" title="Удалить сделку" onclick="requestDeleteDeal(' + d.id + ')">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</button></div>' +
          '<div class="deal-amount">' + formatMoney(d.amount || 0) + ' ₽</div>' +
          '<div class="deal-meta">' + formatDate(d.date) + ' · ' + (d.employee || '') + ' · ' + (d.channel || '') + '</div>' +
          reasonHtml +
          '<select onchange="moveStage(' + d.id + ', this.value, ' + (d.amount || 0) + ')">' + select + '</select>';
        body.appendChild(card);
      });
    });
  }

  async function moveStage(rowNumber, newStatus, amount) {
    try {
      await fetch(UPDATE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': WEBHOOK_SECRET },
        body: JSON.stringify({ accessCode: adminCode, row_number: rowNumber, newStatus: newStatus, amount: amount })
      });
      fetchDeals();
    } catch (e) {}
  }

  function showModal(opts) {
    opts = opts || {};
    return new Promise(function(resolve) {
      const overlay = document.getElementById('modal-overlay');
      const inputWrap = document.getElementById('modal-input-wrap');
      const input = document.getElementById('modal-input');
      const cancelBtn = document.getElementById('modal-cancel');
      const confirmBtn = document.getElementById('modal-confirm');

      document.getElementById('modal-title').textContent = opts.title || '';
      document.getElementById('modal-body').textContent = opts.body || '';
      inputWrap.style.display = opts.withInput ? 'block' : 'none';
      input.value = opts.inputValue || '';
      input.placeholder = opts.inputPlaceholder || '';
      cancelBtn.style.display = opts.alertOnly ? 'none' : 'inline-block';
      confirmBtn.textContent = opts.confirmText || 'ОК';
      confirmBtn.className = 'modal-btn confirm' + (opts.danger ? ' danger' : '');
      cancelBtn.textContent = opts.cancelText || 'Отмена';

      function cleanup(result) {
        overlay.classList.remove('show');
        confirmBtn.removeEventListener('click', onConfirm);
        cancelBtn.removeEventListener('click', onCancel);
        overlay.removeEventListener('click', onOverlay);
        document.removeEventListener('keydown', onKey);
        resolve(result);
      }
      function onConfirm() { cleanup(opts.withInput ? input.value : true); }
      function onCancel() { cleanup(opts.withInput ? null : false); }
      function onOverlay(e) { if (e.target === overlay && !opts.alertOnly) onCancel(); }
      function onKey(e) {
        if (e.key === 'Enter') { e.preventDefault(); onConfirm(); }
        else if (e.key === 'Escape' && !opts.alertOnly) { onCancel(); }
      }

      confirmBtn.addEventListener('click', onConfirm);
      cancelBtn.addEventListener('click', onCancel);
      overlay.addEventListener('click', onOverlay);
      document.addEventListener('keydown', onKey);
      overlay.classList.add('show');
      if (opts.withInput) setTimeout(function() { input.focus(); }, 60);
    });
  }

  const OWNER_SESSION_KEY = 'crm_owner_code';
  const OWNER_SESSION_TTL_MS = 24 * 60 * 60 * 1000; // 24 часа

  function saveOwnerCode(code) {
    try {
      localStorage.setItem(OWNER_SESSION_KEY, JSON.stringify({ code, expires: Date.now() + OWNER_SESSION_TTL_MS }));
    } catch (e) {}
  }

  function loadOwnerCode() {
    try {
      const raw = localStorage.getItem(OWNER_SESSION_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !s.expires || Date.now() > s.expires) {
        localStorage.removeItem(OWNER_SESSION_KEY);
        return null;
      }
      return s.code;
    } catch (e) { return null; }
  }

  function clearOwnerCode() {
    try { localStorage.removeItem(OWNER_SESSION_KEY); } catch (e) {}
  }

  async function requestDeleteDeal(id) {
    const confirmed = await showModal({
      title: 'Удалить сделку?',
      body: 'Это действие нельзя отменить.',
      confirmText: 'Удалить', cancelText: 'Отмена', danger: true
    });
    if (!confirmed) return;

    let ownerCode = loadOwnerCode();
    if (!ownerCode) {
      ownerCode = await showModal({
        title: 'Код владельца',
        body: 'Удаление сделок доступно только владельцу. Введите код.',
        withInput: true, inputPlaceholder: 'Код владельца', confirmText: 'Подтвердить'
      });
      if (!ownerCode) return;
    }

    try {
      const res = await fetch(DELETE_DEAL_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': WEBHOOK_SECRET },
        body: JSON.stringify({ ownerCode: ownerCode, id: id })
      });
      const data = await res.json().catch(function() { return {}; });
      if (!res.ok || data.ok === false) {
        clearOwnerCode();
        await showModal({ title: 'Ошибка', body: data.error || 'Неверный код владельца.', alertOnly: true, confirmText: 'ОК' });
        return;
      }
      saveOwnerCode(ownerCode);
      fetchDeals();
    } catch (e) {
      await showModal({ title: 'Ошибка', body: 'Не удалось удалить — проверьте соединение.', alertOnly: true, confirmText: 'ОК' });
    }
  }
</script>
